name: Build NEXA TV Launcher APK

on:
  push:
    paths:
      - 'NEXA-TV-Launcher/**'
      - '.github/workflows/build-nexa-from-source.yml'
  workflow_dispatch:

concurrency:
  group: nexa-tv-launcher-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compile, test and package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests and build debug APK
        run: gradle -p NEXA-TV-Launcher :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Commit APK into repository
        run: |
          mkdir -p releases
          cp NEXA-TV-Launcher/app/build/outputs/apk/debug/app-debug.apk releases/NEXA-TV-Launcher-v1.2.1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/NEXA-TV-Launcher-v1.2.1-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no repository commit needed."
          else
            git commit -m "build: publish NEXA TV Launcher v1.2.1 debug APK"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-TV-Launcher-debug-APK
          path: NEXA-TV-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-build-reports
          path: |
            NEXA-TV-Launcher/app/build/reports/
            NEXA-TV-Launcher/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
