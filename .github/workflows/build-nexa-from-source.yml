name: Build NEXA TV Launcher Debug APK (manual)

on:
  workflow_dispatch:

concurrency:
  group: nexa-tv-launcher-debug
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and package a separate Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Run tests and build Debug APK
        run: gradle -p NEXA-TV-Launcher :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload separate Debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-TV-Launcher-Debug-TEST-ONLY
          path: NEXA-TV-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-debug-build-reports
          path: |
            NEXA-TV-Launcher/app/build/reports/
            NEXA-TV-Launcher/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
