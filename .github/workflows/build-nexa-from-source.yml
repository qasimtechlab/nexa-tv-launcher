name: Build NEXA TV Launcher APK

on:
  push:
    paths:
      - 'NEXA-TV-Launcher/**'
      - '.github/workflows/build-nexa-from-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble split Kotlin source file
        run: |
          cat NEXA-TV-Launcher/app/src/main/java/com/qasim/nexa/launcher/MainActivity.kt.part-*.txt > NEXA-TV-Launcher/app/src/main/java/com/qasim/nexa/launcher/MainActivity.kt
          test -s NEXA-TV-Launcher/app/src/main/java/com/qasim/nexa/launcher/MainActivity.kt
          grep -q "class MainActivity" NEXA-TV-Launcher/app/src/main/java/com/qasim/nexa/launcher/MainActivity.kt
      - name: Run unit tests and build debug APK
        run: gradle -p NEXA-TV-Launcher :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-TV-Launcher-debug-APK
          path: NEXA-TV-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-build-reports
          path: |
            NEXA-TV-Launcher/app/build/reports/
            NEXA-TV-Launcher/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
