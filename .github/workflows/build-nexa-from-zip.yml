name: Build NEXA TV Launcher APK from uploaded ZIP

on:
  push:
    paths:
      - 'NEXA-TV-Launcher-v1-source.zip'
      - '.github/workflows/build-nexa-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Extract source archive
        run: unzip -q NEXA-TV-Launcher-v1-source.zip -d source
      - name: Run tests, lint and build APK
        run: gradle -p source/NEXA-TV-Launcher :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-TV-Launcher-debug-APK
          path: source/NEXA-TV-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-build-reports
          path: |
            source/NEXA-TV-Launcher/app/build/reports/
            source/NEXA-TV-Launcher/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
